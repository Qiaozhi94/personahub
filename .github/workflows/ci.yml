name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Verify (lint, typecheck, test, docs, build)
    # The test suite is Windows-first (CRLF line endings, .exe/.cmd shim
    # fixtures, Windows executable semantics) — CI must match the dev platform.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node LTS
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unified quality gate
        run: npm run verify

      # Not part of `verify`: the local loop already gets type safety from
      # typecheck, so paying for a full production build on every local run
      # buys nothing. CI is where the build artifact actually has to hold up.
      - name: Production build
        run: npm run build

  e2e:
    name: E2E (Playwright Chromium)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node LTS
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npm run test:e2e:install

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
